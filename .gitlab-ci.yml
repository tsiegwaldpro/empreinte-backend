stages:
  - deploy

deploy:
  image: alpine
  stage: deploy
  before_script:
    - apk add --no-cache lftp
  script:
    - echo "🚀 Déploiement du backend dans api.empreinte-app.fr (mode debug)..."
    - lftp -d -c "set ftp:ssl-allow no; open -u deploy@empreinte-app.fr,VWtrme7Y6VXHNn ftp.dalo8522.odns.fr; mirror -R --delete --exclude-glob node_modules --exclude-glob .git --exclude-glob tests ./ ./"
