stages:
  - deploy

deploy:
  image: alpine
  stage: deploy
  before_script:
    - apk add --no-cache lftp
  script:
    - echo "📦 Fichiers dans le dossier courant :"
    - find . -type f | wc -l
    - echo "🚀 Déploiement backend API via FTP (mode debug activé)"
    - lftp -d -c "set ftp:ssl-allow no; open -u $FTP_USER,$FTP_PASS ftp.dalo8522.odns.fr; mirror -R --delete --exclude-glob node_modules --exclude-glob .git* --exclude-glob .env --exclude-glob .vscode --exclude-glob *.log --exclude-glob tests ./ ./"
