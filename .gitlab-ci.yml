stages:
  - deploy

deploy:
  image: alpine
  stage: deploy
  before_script:
    - apk add --no-cache lftp
  script:
    - echo "📁 Création du dossier deploy/"
    - mkdir deploy
    - echo "📦 Copie des fichiers nécessaires dans deploy/"
    - cp index.js package.json deploy/
    - cp -r config controllers middlewares models routes services utils deploy/
    - echo "🔐 Génération du .env depuis les variables CI/CD"
    - echo "PORT=3000" > deploy/.env
    - echo "MONGODB_URI=$MONGODB_URI" >> deploy/.env
    - echo "JWT_SECRET=$JWT_SECRET" >> deploy/.env
    - echo "🔢 Nombre de fichiers à déployer :"
    - find deploy -type f | wc -l
    - echo "🚀 Déploiement du dossier deploy/ vers api.empreinte-app.fr"
    - lftp -d -c "set ftp:ssl-allow no; open -u $FTP_USER,$FTP_PASS ftp.dalo8522.odns.fr; mirror -R --delete --exclude-glob mongodb/ deploy/ ./"
