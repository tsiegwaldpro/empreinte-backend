stages:
  - deploy
  - notify

deploy:
  image: alpine
  stage: deploy
  before_script:
    - apk add --no-cache lftp
  script:
    - echo "📁 Création du dossier deploy/"
    - mkdir deploy
    - echo "📦 Copie des fichiers nécessaires dans deploy/"
    - cp index.js package.json deploy/
    - cp -r config controllers middlewares models routes services utils deploy/
    - echo "🔐 Génération du .env depuis les variables CI/CD"
    - echo "PORT=3000" > deploy/.env
    - echo "MONGODB_URI=$MONGODB_URI" >> deploy/.env
    - echo "JWT_SECRET=$JWT_SECRET" >> deploy/.env
    - echo "🔢 Nombre de fichiers à déployer :"
    - find deploy -type f | wc -l
    - echo "🚀 Déploiement du dossier deploy/ vers api.empreinte-app.fr"
    - lftp -d -c "set ftp:ssl-allow no; open -u $FTP_USER,$FTP_PASS ftp.dalo8522.odns.fr; mirror -R --delete --exclude-glob mongodb/ deploy/ ./"
  only:
    - prod

notify:
  image: curlimages/curl:latest
  stage: notify
  script:
    - echo "📣 Envoi d’un embed Discord BACKEND — Succès"
    - |
      curl -H "Content-Type: application/json" \
           -X POST \
           -d "{
             \"embeds\": [{
               \"title\": \"✅ Déploiement backend réussi — Empreinte (prod)\",
               \"description\": \"Les fichiers backend ont été mis en ligne sur **api.empreinte-app.fr** 🎉\",
               \"color\": 65280,
               \"fields\": [
                 { \"name\": \"Auteur du commit\", \"value\": \"$GITLAB_USER_NAME\", \"inline\": true },
                 { \"name\": \"Pipeline\", \"value\": \"[Voir dans GitLab]($CI_PIPELINE_URL)\", \"inline\": true }
               ],
               \"footer\": {
                 \"text\": \"Déployé le $(date +'%d/%m/%Y à %Hh%M')\"
               }
             }]
           }" \
           https://discord.com/api/webhooks/1371733095438356490/agrJaBFR_P3jV_RUvd7KW86mKMkuyWwZPzL_mOAN7oSVdYcWz7gSU4AiwTWMbZ0kBPEE
  only:
    - prod
  when: on_success

notify_failure:
  image: curlimages/curl:latest
  stage: notify
  script:
    - echo "❌ Envoi d’un embed Discord BACKEND — Échec"
    - |
      curl -H "Content-Type: application/json" \
           -X POST \
           -d "{
             \"embeds\": [{
               \"title\": \"🚨 Échec du déploiement backend — Empreinte (prod)\",
               \"description\": \"Une erreur s’est produite lors du déploiement du backend.\",
               \"color\": 16711680,
               \"fields\": [
                 { \"name\": \"Auteur du commit\", \"value\": \"$GITLAB_USER_NAME\", \"inline\": true },
                 { \"name\": \"Pipeline\", \"value\": \"[Voir le pipeline]($CI_PIPELINE_URL)\", \"inline\": true }
               ],
               \"footer\": {
                 \"text\": \"Échec détecté le $(date +'%d/%m/%Y à %Hh%M')\"
               }
             }]
           }" \
           https://discord.com/api/webhooks/1371733095438356490/agrJaBFR_P3jV_RUvd7KW86mKMkuyWwZPzL_mOAN7oSVdYcWz7gSU4AiwTWMbZ0kBPEE
  only:
    - prod
  when: on_failure
